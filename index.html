<!DOCTYPE html>

<title>Shanghai & Hangzhou Trip Planner — Sep 1-10, 2027</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#c41e3a;--accent-dk:#8b1528;--accent-lt:#fef2f2;
  --bg:#f8f6f4;--card:#fff;--border:#e8e0d8;--muted:#6b7280;--dark:#1c1917;
  --red:#ef4444;--green:#22c55e;--blue:#6366f1;--cyan:#0891b2;--amber:#f59e0b;
  --pink:#ec4899;--purple:#a855f7;--teal:#14b8a6;--gold:#d4a574;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --radius:10px;
}
html{font-size:15px;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--dark);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none;font-weight:600}
a:hover{text-decoration:underline}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--font);font-size:.9rem}
.hdr{background:linear-gradient(135deg,var(--accent-dk),var(--accent));padding:0;position:sticky;top:0;z-index:100}
.hdr-credit{background:rgba(0,0,0,.2);text-align:center;padding:4px 16px;font-size:.62rem;color:#fecaca;letter-spacing:1.2px;font-weight:600;text-transform:uppercase}
.hdr-main{padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.hdr-left{display:flex;align-items:center;gap:10px}
.hdr-logo{width:42px;height:42px;flex-shrink:0}
.hdr-title{color:#fff;font-weight:800;font-size:1.05rem}
.hdr-sub{color:#fecaca;font-size:.7rem}
.btn-dl{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:6px 14px;font-size:.75rem;font-weight:600;display:flex;align-items:center;gap:6px;transition:background .2s}
.btn-dl:hover{background:rgba(255,255,255,.3)}
.hdr-btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn-save{background:#22c55e;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:6px 14px;font-size:.75rem;font-weight:700;display:flex;align-items:center;gap:6px;transition:all .2s;position:relative}
.btn-save:hover{background:#16a34a}
.btn-save.has-changes{animation:pulse-save 1.5s ease infinite}
.btn-save .save-dot{width:8px;height:8px;border-radius:50%;background:#fbbf24;display:none;flex-shrink:0}
.btn-save.has-changes .save-dot{display:block;animation:blink-dot 1s ease infinite}
.btn-save.saved{background:#065f46}
@keyframes pulse-save{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.4)}50%{box-shadow:0 0 0 8px rgba(34,197,94,0)}}
@keyframes blink-dot{0%,100%{opacity:1}50%{opacity:.3}}
.save-banner{display:none;background:#7f1d1d;color:#fecaca;text-align:center;padding:6px 14px;font-size:.75rem;font-weight:600;border-bottom:1px solid rgba(255,255,255,.1)}
.save-banner.show{display:block;animation:slide-down .3s ease}
@keyframes slide-down{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:72px;z-index:99;-webkit-overflow-scrolling:touch}
.tab-btn{flex:1;min-width:56px;padding:10px 4px;border:none;background:transparent;color:var(--muted);font-weight:500;font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:2px;border-bottom:3px solid transparent;transition:all .15s}
.tab-btn.active{color:var(--accent);font-weight:700;border-bottom-color:var(--accent)}
.tab-btn .ico{font-size:1.1rem}
.content{padding:14px;max-width:740px;margin:0 auto}
.section{display:none}.section.active{display:block}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;margin-bottom:12px}
.card-head{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:.9rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.card-body{padding:14px 16px}
.hero{background:linear-gradient(135deg,var(--accent),var(--accent-dk));border-radius:var(--radius);padding:22px;color:#fff;margin-bottom:14px}
.hero-tag{font-size:.65rem;text-transform:uppercase;letter-spacing:2px;opacity:.7;margin-bottom:6px}
.hero h2{font-size:1.25rem;font-weight:800;line-height:1.3;margin:0}
.hero-meta{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap;font-size:.8rem}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.7rem;font-weight:700}
.badge-green{background:#dcfce7;color:#166534}
.badge-amber{background:#fef3c7;color:#92400e}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-pink{background:#fce7f3;color:#9d174d}
.btn{border:none;border-radius:6px;padding:8px 16px;font-size:.85rem;font-weight:600;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:var(--accent);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-secondary{background:#f1f5f9;color:var(--dark)}
.btn-sm{padding:4px 10px;font-size:.75rem}
.btn-block{width:100%;text-align:center}
.day-pills{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.day-pill{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--dark);font-weight:600;font-size:.82rem;white-space:nowrap;transition:all .15s}
.day-pill.active{border-color:var(--accent);background:var(--accent);color:#fff}
.tl-item{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border)}
.tl-item:last-child{border-bottom:none}
.tl-dot-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.tl-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;color:#fff;flex-shrink:0}
.tl-line{width:2px;flex:1;background:var(--border);margin-top:4px}
.tl-content{flex:1;min-width:0}
.tl-time{font-size:.75rem;font-weight:700}
.tl-title{font-weight:700;font-size:.9rem;margin-top:2px}
.tl-desc{font-size:.82rem;color:var(--muted);margin-top:4px;line-height:1.5}
.tl-links{margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;font-size:.78rem}
.tl-actions{display:flex;gap:4px;flex-shrink:0}
.tl-actions button{background:none;border:none;font-size:.95rem;padding:2px}
.cr-item{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);align-items:flex-start}
.cr-item:last-child{border-bottom:none}
.cr-num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;flex-shrink:0}
.cr-body{flex:1;min-width:0}
.cr-name{font-weight:700;font-size:.9rem}
.cr-cat{background:#f1f5f9;color:var(--muted);padding:1px 8px;border-radius:4px;font-size:.68rem;margin-left:6px}
.cr-why{font-size:.82rem;color:var(--muted);margin-top:4px}
.cr-meta{margin-top:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.78rem}
.map-wrap{position:relative;width:100%;padding-bottom:56%;background:#e2e8f0;border-radius:0}
.map-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.map-stop{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:.82rem}
.map-stop:last-child{border-bottom:none}
.map-num{width:22px;height:22px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:800;flex-shrink:0}
.ev-row{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.ev-row:last-child{border-bottom:none}
.res-box{background:#fefce8;border-radius:var(--radius);border:1px solid #fde047;padding:14px 16px;margin-bottom:12px}
.ferry-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-bottom:12px}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:.72rem;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.form-input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:.88rem}
.form-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(196,30,58,.12)}
textarea.form-input{min-height:60px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border-radius:12px;width:100%;max-width:480px;max-height:85vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.modal-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:1rem;font-weight:700}
.modal-close{background:none;border:none;font-size:1.2rem;color:var(--muted)}
.modal-body{padding:20px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 24px;border-radius:8px;font-size:.85rem;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.2);opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.mod-item{padding:12px;border:1px solid var(--border);border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.mod-item-info{flex:1;min-width:180px}
.mod-item-title{font-weight:600;font-size:.85rem}
.mod-item-desc{font-size:.78rem;color:var(--muted);margin-top:2px}
.mod-item-actions{display:flex;gap:6px}
.drag-list{list-style:none;padding:0;margin:0}
.drag-item{padding:9px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:.82rem;background:var(--card);transition:transform .15s,box-shadow .15s;user-select:none;position:relative}
.drag-item:last-child{border-bottom:none}
.drag-handle{cursor:grab;font-size:1rem;color:var(--muted);flex-shrink:0;padding:4px;touch-action:none}
.drag-handle:active{cursor:grabbing}
.drag-item.dragging{opacity:.85;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:50;border-radius:8px;transform:scale(1.02)}
.drag-item.drag-over-above{border-top:3px solid var(--accent);padding-top:6px}
.drag-item.drag-over-below{border-bottom:3px solid var(--accent);padding-bottom:6px}
.drag-placeholder{background:var(--accent-lt);border:2px dashed var(--accent);border-radius:6px;min-height:42px;margin:2px 0}
.sort-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:#f8fafc;border-bottom:1px solid var(--border);font-size:.78rem;flex-wrap:wrap;gap:6px}
.sort-bar .sort-info{color:var(--muted);display:flex;align-items:center;gap:5px}
.btn-sort{background:var(--accent-lt);color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:4px 10px;font-size:.72rem;font-weight:700;transition:all .15s}
.btn-sort:hover{background:var(--accent);color:#fff}
.btn-sort.active{background:var(--accent);color:#fff}
.route-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.drag-hint{font-size:.7rem;color:var(--muted);padding:6px 12px;text-align:center;background:#f8fafc;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:5px}
.trail-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;margin-bottom:14px;transition:box-shadow .2s}
.trail-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.06)}
.trail-top{padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.trail-name{font-weight:800;font-size:1rem;color:var(--dark)}
.trail-loc{font-size:.78rem;color:var(--muted);margin-top:3px}
.trail-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.trail-badge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:5px;font-size:.68rem;font-weight:700}
.trail-badge-easy{background:#dcfce7;color:#166534}
.trail-badge-moderate{background:#fef3c7;color:#92400e}
.trail-badge-hard{background:#fee2e2;color:#991b1b}
.trail-badge-info{background:#dbeafe;color:#1e40af}
.trail-badge-surface{background:#f3e8ff;color:#6b21a8}
.trail-badge-time{background:#f0fdf4;color:#065f46}
.trail-desc{padding:0 16px 10px;font-size:.85rem;color:var(--dark);line-height:1.6}
.trail-senior{margin:0 16px 12px;padding:10px 14px;background:#fef3c7;border:1px solid #fde68a;border-radius:8px;font-size:.8rem;line-height:1.5}
.trail-senior-title{font-weight:700;color:#92400e;font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.trail-links{padding:8px 16px 14px;display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;border-top:1px solid var(--border)}
.trail-actions-bar{display:flex;gap:4px;flex-shrink:0}
.trail-actions-bar button{background:none;border:none;font-size:1rem;padding:2px;cursor:pointer}
.trail-filter{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.trail-filter-btn{padding:7px 13px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--dark);font-weight:600;font-size:.78rem;white-space:nowrap;cursor:pointer;transition:all .15s}
.trail-filter-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}
@media(max-width:480px){
  .hero h2{font-size:1.1rem}
  .hero-meta{font-size:.75rem;gap:10px}
  .content{padding:10px}
  .form-row{grid-template-columns:1fr}
  .ferry-grid{grid-template-columns:1fr}
}
@media print{
  .hdr,.tabs,.btn-dl,.tl-actions,.btn,.modal-bg,.toast{display:none!important}
  .section{display:block!important}
  .card{break-inside:avoid}
}
</style>
</head>

      {id:"d1s3",time:"6:30 PM",type:"activity",title:"\ud83c\udf06 Evening Walk on the Bund",desc:"Stroll the famous waterfront promenade. Watch Pudong skyline light up across the Huangpu River. Best photo spot in Shanghai.",lat:31.2396,lng:121.4908},
      {id:"d1s4",time:"8:00 PM",type:"dining",title:"\ud83c\udf7d\ufe0f Dinner at Ren He Guan",desc:"Michelin-starred Shanghainese. Try hong shao rou (braised pork belly) and smoked fish. Book ahead.",lat:31.2282,lng:121.4745}
    ]},
    {day:2,date:"Sep 2 (Thu)",title:"Classic Shanghai \u2014 Old Meets New",segments:[
      {id:"d2s1",time:"8:00 AM",type:"beverage",title:"\u2615 Breakfast at Hotel",desc:"Fairmont breakfast buffet \u2014 congee, sheng jian bao, and Western options.",lat:31.2401,lng:121.4907},
      {id:"d2s2",time:"9:30 AM",type:"poi",title:"\ud83c\udfef Yu Garden (Yuyuan Garden)",desc:"Classical Ming Dynasty garden built 1559. Ornate pavilions, koi ponds, rockeries. Visit Huxinting Tea House on the lake.",lat:31.2272,lng:121.4924},
      {id:"d2s3",time:"11:00 AM",type:"dining",title:"\ud83e\udd5f Nanxiang Steamed Buns (Yu Garden)",desc:"Famous xiaolongbao since 1900. Go to 3rd floor for fine dining \u2014 less crowded, better quality.",lat:31.2274,lng:121.4928},
      {id:"d2s4",time:"12:30 PM",type:"activity",title:"\ud83d\udecd\ufe0f Yu Garden Bazaar & Old City God Temple",desc:"Browse crafts, snacks, souvenirs. Try tang yuan (glutinous rice balls) and stinky tofu.",lat:31.2280,lng:121.4925},
      {id:"d2s5",time:"2:30 PM",type:"poi",title:"\ud83c\udfdb\ufe0f Shanghai Museum (East Branch)",desc:"World-class Chinese bronzes, ceramics, jade, paintings. In Pudong. Allow 2\u20133 hours.",lat:31.2175,lng:121.5468},
      {id:"d2s6",time:"5:30 PM",type:"activity",title:"\ud83c\udf03 Shanghai Tower Observation Deck",desc:"World\u2019s 2nd tallest building at 632m. 118th floor panoramic views. Go near sunset.",lat:31.2355,lng:121.5015},
      {id:"d2s7",time:"7:30 PM",type:"dining",title:"\ud83c\udf7d\ufe0f Dinner in Lujiazui",desc:"Try Yi Long Court for Cantonese or Da Dong for Peking Duck. Views of the Bund at night.",lat:31.2362,lng:121.4995}
    ]},
    {day:3,date:"Sep 3 (Fri)",title:"French Concession & Art District",segments:[
      {id:"d3s1",time:"8:30 AM",type:"beverage",title:"\u2615 Caf\u00e9 del Volc\u00e1n",desc:"Specialty coffee in the French Concession. Excellent flat whites in a cozy courtyard.",lat:31.2090,lng:121.4540},
      {id:"d3s2",time:"10:00 AM",type:"activity",title:"\ud83c\udf33 French Concession Walking Tour",desc:"Tree-lined Wukang Rd and Anfu Rd. Art Deco villas, boutiques, the iconic Wukang Mansion.",lat:31.2057,lng:121.4376},
      {id:"d3s3",time:"11:30 AM",type:"poi",title:"\ud83c\udfa8 Tianzifang Art District",desc:"Maze of narrow lanes in old Shikumen houses. Art studios, galleries, craft shops, caf\u00e9s.",lat:31.2105,lng:121.4685},
      {id:"d3s4",time:"1:00 PM",type:"dining",title:"\ud83c\udf5c Jia Jia Tang Bao",desc:"Legendary soup dumplings. Try crab roe and pork xiaolongbao. Tiny shop \u2014 short queue. Ultra cheap.",lat:31.2375,lng:121.4803},
      {id:"d3s5",time:"2:30 PM",type:"poi",title:"\ud83d\uddbc\ufe0f West Bund Art District",desc:"Gallery row: Long Museum, Yuz Museum, Tank Shanghai Art Centre. World-class contemporary art.",lat:31.1864,lng:121.4459},
      {id:"d3s6",time:"5:00 PM",type:"activity",title:"\ud83c\udf05 Xintiandi Evening Stroll",desc:"Restored Shikumen neighbourhood. Upscale dining, bars, shops. Site of First CPC National Congress.",lat:31.2189,lng:121.4744},
      {id:"d3s7",time:"7:00 PM",type:"dining",title:"\ud83c\udf7d\ufe0f Di Shui Dong",desc:"Beloved Hunan restaurant in French Concession. Spicy ribs and cumin lamb are signatures.",lat:31.2147,lng:121.4557}
    ]},
    {day:4,date:"Sep 4 (Sat)",title:"Zhujiajiao Water Town Day Trip",segments:[
      {id:"d4s1",time:"8:00 AM",type:"drive",title:"\ud83d\ude97 Depart for Zhujiajiao Water Town",desc:"Taxi/Didi (~1 hr) or Metro Line 17 to this 1,700-year-old water town on Shanghai\u2019s outskirts.",lat:31.2401,lng:121.4907},
      {id:"d4s2",time:"9:30 AM",type:"poi",title:"\ud83c\udfe0 Zhujiajiao Ancient Town",desc:"\u201cVenice of Shanghai.\u201d Stone bridges, canal houses, Ming/Qing Dynasty architecture. Free entry.",lat:31.1074,lng:121.0573},
      {id:"d4s3",time:"10:30 AM",type:"activity",title:"\ud83d\udea3 Gondola Ride on Canals",desc:"Traditional wooden boat through narrow canals. Pass under 36 stone bridges including Fangsheng Bridge.",lat:31.1078,lng:121.0580},
      {id:"d4s4",time:"12:00 PM",type:"dining",title:"\ud83c\udf56 Lunch \u2014 Red Braised Pork & Local Snacks",desc:"Famous zha rou (braised pork) at a canal-side restaurant. Try meat zongzi and stinky tofu.",lat:31.1070,lng:121.0575},
      {id:"d4s5",time:"1:30 PM",type:"poi",title:"\ud83c\udfdb\ufe0f Kezhi Garden & Chenghuang Temple",desc:"Classical garden and City God Temple. Climb tower for panoramic views over the waterways.",lat:31.1068,lng:121.0570},
      {id:"d4s6",time:"3:00 PM",type:"activity",title:"\ud83c\udf75 Tea at a Canal-side Teahouse",desc:"Traditional teahouse overlooking the water. Local green tea. A perfect slow moment.",lat:31.1072,lng:121.0577},
      {id:"d4s7",time:"4:30 PM",type:"drive",title:"\ud83d\ude97 Return to Shanghai",desc:"Taxi or Metro Line 17 back. Rest at hotel before dinner.",lat:31.2401,lng:121.4907},
      {id:"d4s8",time:"7:00 PM",type:"dining",title:"\ud83c\udf7d\ufe0f Cheng Long Hang \u2b50 RESERVED",desc:"Michelin-starred crab specialist. September is peak hairy crab season! Full crab feast with crab roe xiaolongbao.",lat:31.2405,lng:121.4878,reserved:true}
    ]},
    {day:5,date:"Sep 5 (Sun)",title:"Pudong, Science & Nanjing Road",segments:[
      {id:"d5s1",time:"9:00 AM",type:"poi",title:"\ud83c\udf10 Shanghai Science & Technology Museum",desc:"Four-storey interactive museum. Space theatre, IMAX dome, robotics. Metro Line 2 direct.",lat:31.2180,lng:121.5417},
      {id:"d5s2",time:"11:30 AM",type:"activity",title:"\ud83c\udfa1 Century Park Walk",desc:"Shanghai\u2019s largest park. Lakes, meadows, tree-lined paths. Peaceful city escape.",lat:31.2100,lng:121.5500},
      {id:"d5s3",time:"1:00 PM",type:"dining",title:"\ud83c\udf5c Din Tai Fung (IFC Mall)",desc:"Famous Taiwanese xiaolongbao chain. Each dumpling 21g with 18 folds. Try the truffle version.",lat:31.2379,lng:121.5025},
      {id:"d5s4",time:"2:30 PM",type:"activity",title:"\ud83d\udecd\ufe0f Nanjing Road Pedestrian Street",desc:"China\u2019s most famous shopping street. 5.5 km of neon signs, flagship stores, street food.",lat:31.2345,lng:121.4727},
      {id:"d5s5",time:"4:30 PM",type:"poi",title:"\u26e9\ufe0f Jing\u2019an Temple",desc:"1,700-year-old Buddhist temple surrounded by skyscrapers. Ancient gold against modern glass.",lat:31.2236,lng:121.4489},
      {id:"d5s6",time:"6:00 PM",type:"beverage",title:"\ud83c\udf78 Cocktails at Bar Leone",desc:"World\u2019s #1 bar (from Hong Kong) with a Shanghai outpost. Craft cocktails in glamorous setting.",lat:31.2300,lng:121.4750},
      {id:"d5s7",time:"7:30 PM",type:"dining",title:"\ud83c\udf7d\ufe0f Fu He Hui \u2b50 RESERVED",desc:"Vegetarian fine dining \u2014 Shanghai\u2019s only veggie Michelin star. Seasonal creative Chinese cuisine.",lat:31.2099,lng:121.4335,reserved:true}
    ]},
    {day:6,date:"Sep 6 (Mon)",title:"Shanghai Deep Dive & Farewell",segments:[
      {id:"d6s1",time:"8:30 AM",type:"beverage",title:"\u2615 Seesaw Coffee (Anfu Road)",desc:"Shanghai\u2019s leading specialty coffee brand. Beautiful minimalist design. Perfect cortado.",lat:31.2090,lng:121.4420},
      {id:"d6s2",time:"10:00 AM",type:"poi",title:"\ud83c\udfdb\ufe0f Propaganda Poster Art Centre",desc:"Fascinating private collection of Chinese political propaganda posters from the 1950s\u20131970s.",lat:31.2050,lng:121.4470},
      {id:"d6s3",time:"11:30 AM",type:"activity",title:"\ud83c\udf3f Fuxing Park",desc:"Shanghai\u2019s oldest park modelled on French gardens. Watch locals \u2014 tai chi, dancing, erhu music.",lat:31.2143,lng:121.4685},
      {id:"d6s4",time:"1:00 PM",type:"dining",title:"\ud83e\udd5f Yang\u2019s Fried Dumplings",desc:"Iconic sheng jian bao. Crispy golden bottom, soft steamed top, juicy filling. Try Huanghe Rd location.",lat:31.2370,lng:121.4737},
      {id:"d6s5",time:"2:30 PM",type:"poi",title:"\ud83d\uddbc\ufe0f M50 Creative Park",desc:"Former textile mills \u2192 art galleries and studios. Shanghai\u2019s original art district. Free entry.",lat:31.2466,lng:121.4398},
      {id:"d6s6",time:"4:30 PM",type:"activity",title:"\ud83d\udea2 Huangpu River Cruise",desc:"One-hour sunset cruise along the Huangpu. Both skylines from the water. Book 5 PM departure.",lat:31.2300,lng:121.4850},
      {id:"d6s7",time:"7:00 PM",type:"dining",title:"\ud83c\udf7d\ufe0f Shanghai Farewell Dinner",desc:"Splurge at Ultraviolet by Paul Pairet (20-seat immersive), or Mr & Mrs Bund for Bund views.",lat:31.2415,lng:121.4905},
      {id:"d6s8",time:"9:00 PM",type:"activity",title:"\ud83c\udf03 Final Bund Night Walk",desc:"Last stroll along the Bund promenade. Unforgettable skyline. Pack for tomorrow\u2019s train to Hangzhou.",lat:31.2396,lng:121.4908}
    ]},
    {day:7,date:"Sep 7 (Tue)",title:"Shanghai \u2192 Hangzhou by High-Speed Rail",segments:[
      {id:"d7s1",time:"7:00 AM",type:"stay",title:"\ud83c\udfe8 Check out of Fairmont Peace Hotel",desc:"Early checkout. Metro Line 2 to Hongqiao Station (~40 min) or Didi (~25 min).",lat:31.2401,lng:121.4907},
      {id:"d7s2",time:"9:00 AM",type:"drive",title:"\ud83d\ude84 High-Speed Train to Hangzhou",desc:"CRH train: Shanghai Hongqiao \u2192 Hangzhou East. Only 50 min! Book on Trip.com or 12306 app.",lat:31.1949,lng:121.3222},
      {id:"d7s3",time:"10:30 AM",type:"stay",title:"\ud83c\udfe8 Check in at Four Seasons Hangzhou",desc:"Lakeside hotel near West Lake and Lingyin Temple. Gardens and tea plantations surround it.",lat:30.2425,lng:120.1158},
      {id:"d7s4",time:"12:00 PM",type:"dining",title:"\ud83c\udf7d\ufe0f Grandma\u2019s Kitchen (Waipo Jia)",desc:"Beloved Hangzhou chain. Try Dongpo pork, West Lake vinegar fish, and beggar\u2019s chicken.",lat:30.2560,lng:120.1545},
      {id:"d7s5",time:"1:30 PM",type:"poi",title:"\ud83c\udfee Hefang Street (Qinghefang)",desc:"Ancient pedestrian street. Traditional medicine shops, calligraphy stores, street food, Hu Qingyu Tang pharmacy.",lat:30.2480,lng:120.1650},
      {id:"d7s6",time:"3:30 PM",type:"activity",title:"\ud83d\udeb2 West Lake Bike Ride \u2014 Causeways",desc:"Rent shared bikes. Ride Bai Causeway and Su Causeway. Pass Broken Bridge, Baochu Pagoda views.",lat:30.2564,lng:120.1528},
      {id:"d7s7",time:"5:30 PM",type:"activity",title:"\ud83d\udea4 West Lake Boat Cruise",desc:"Boat to Three Pools Mirroring the Moon (\u4e09\u6f6d\u5370\u6708). One of the \u2018Ten Views.\u2019 Gorgeous at sunset.",lat:30.2390,lng:120.1413},
      {id:"d7s8",time:"7:00 PM",type:"dining",title:"\ud83c\udf7d\ufe0f Lou Wai Lou \u2b50 RESERVED",desc:"Hangzhou\u2019s most famous restaurant since 1848, on West Lake. Iconic Dongpo Pork and vinegar fish.",lat:30.2545,lng:120.1415,reserved:true}
    ]},
    {day:8,date:"Sep 8 (Wed)",title:"Hangzhou \u2014 Temples, Tea & Culture",segments:[
      {id:"d8s1",time:"7:30 AM",type:"activity",title:"\ud83e\uddd8 Tai Chi at West Lake",desc:"Join locals for morning tai chi. Calligraphers, erhu players, and dancers by the lake.",lat:30.2500,lng:120.1500},
      {id:"d8s2",time:"9:00 AM",type:"poi",title:"\u26e9\ufe0f Lingyin Temple (Soul\u2019s Retreat)",desc:"One of China\u2019s most important Buddhist temples, 1,700 years old. 20m Sakyamuni Buddha and Feilai Peak carvings.",lat:30.2395,lng:120.1000},
      {id:"d8s3",time:"11:00 AM",type:"poi",title:"\ud83d\uddff Feilai Peak Stone Carvings",desc:"470+ Buddhist grotto sculptures dating from the 10th century. Remarkable Five Dynasties rock art.",lat:30.2400,lng:120.0990},
      {id:"d8s4",time:"12:30 PM",type:"dining",title:"\ud83e\udd6c Vegetarian Lunch at Lingyin Temple",desc:"Traditional Buddhist vegetarian cuisine near the temple. Serene and memorable.",lat:30.2398,lng:120.1005},
      {id:"d8s5",time:"2:00 PM",type:"activity",title:"\ud83c\udf75 Meijiawu Tea Plantation Visit",desc:"Longjing (Dragon Well) tea village. Walk tea fields, watch roasting, taste fresh tea. Buy to take home.",lat:30.2250,lng:120.0925},
      {id:"d8s6",time:"4:00 PM",type:"poi",title:"\ud83c\udfef Leifeng Pagoda",desc:"Rebuilt pagoda on south shore. Famous for Legend of the White Snake. Elevator to top for lake views.",lat:30.2316,lng:120.1480},
      {id:"d8s7",time:"5:30 PM",type:"poi",title:"\ud83c\udfad China National Silk Museum",desc:"World\u2019s largest silk museum. 5,000-year history of Chinese silk. Beautiful exhibitions.",lat:30.2280,lng:120.1530},
      {id:"d8s8",time:"7:30 PM",type:"dining",title:"\ud83c\udf7d\ufe0f Green Tea Restaurant (L\u00fccha)",desc:"Hugely popular Hangzhou restaurant (expect queue). Green tea shrimp and bread pudding.",lat:30.2530,lng:120.1380}
    ]},
    {day:9,date:"Sep 9 (Thu)",title:"Hangzhou \u2014 Wetlands, Grand Canal & Hidden Gems",segments:[
      {id:"d9s1",time:"8:30 AM",type:"beverage",title:"\u2615 Breakfast at Hotel",desc:"Four Seasons breakfast with garden views. Local congee and scallion pancakes.",lat:30.2425,lng:120.1158},
      {id:"d9s2",time:"10:00 AM",type:"poi",title:"\ud83c\udf3f Xixi National Wetland Park",desc:"China\u2019s first national wetland park. Boat rides through misty waterways, persimmon groves, reed marshes.",lat:30.2668,lng:120.0618},
      {id:"d9s3",time:"12:30 PM",type:"dining",title:"\ud83c\udf7d\ufe0f Lunch inside Xixi Wetland",desc:"Restaurants within the park. Fresh fish dishes in traditional buildings over the water.",lat:30.2665,lng:120.0625},
      {id:"d9s4",time:"2:00 PM",type:"poi",title:"\ud83d\udea4 Beijing-Hangzhou Grand Canal",desc:"Qiaoxi Historic District along the world\u2019s longest man-made waterway. UNESCO since 2014. Museums and old bridges.",lat:30.3150,lng:120.1370},
      {id:"d9s5",time:"3:30 PM",type:"poi",title:"\ud83c\udfdb\ufe0f Grand Canal Museum",desc:"Modern museum about the 1,794 km canal\u2019s 2,500-year history. Interactive exhibits.",lat:30.3170,lng:120.1350},
      {id:"d9s6",time:"5:00 PM",type:"activity",title:"\ud83c\udf05 Sunset from Baochu Pagoda Hill",desc:"Short hike to slender pagoda on Precious Stone Hill. Panoramic West Lake views in golden light.",lat:30.2620,lng:120.1450},
      {id:"d9s7",time:"7:00 PM",type:"dining",title:"\ud83c\udf7d\ufe0f Farewell Dinner at Zhi Wei Guan",desc:"Hangzhou institution. West Lake fish in vinegar, shrimp with Longjing tea, Dongpo pork. Perfect farewell.",lat:30.2550,lng:120.1620}
    ]},
    {day:10,date:"Sep 10 (Fri)",title:"Departure from Hangzhou",segments:[
      {id:"d10s1",time:"7:30 AM",type:"beverage",title:"\u2615 Sunrise Walk at West Lake",desc:"Final morning by the lake. Watch mist rise. Grab tea at a lakeside stall.",lat:30.2500,lng:120.1500},
      {id:"d10s2",time:"9:00 AM",type:"stay",title:"\ud83c\udfe8 Check out of Four Seasons",desc:"Pack up. Final photos of lake and gardens.",lat:30.2425,lng:120.1158},
      {id:"d10s3",time:"10:00 AM",type:"activity",title:"\ud83d\udecd\ufe0f Last-Minute Shopping",desc:"Pick up Longjing tea, silk scarves. Wushan Night Market area for souvenirs.",lat:30.2470,lng:120.1640},
      {id:"d10s4",time:"12:00 PM",type:"dining",title:"\ud83e\udd5f Final Meal \u2014 Zhiweiguan Snacks",desc:"Quick lunch: cat\u2019s ear noodles, sliced fish soup, sweet lotus root.",lat:30.2475,lng:120.1645},
      {id:"d10s5",time:"2:00 PM",type:"drive",title:"\ud83d\ude95 Taxi to Xiaoshan Airport",desc:"Didi/taxi (~45 min) or Metro Line 1 to airport.",lat:30.2340,lng:120.4360},
      {id:"d10s6",time:"5:00 PM",type:"drive",title:"\u2708\ufe0f Flight Home",desc:"Depart from Hangzhou Xiaoshan Airport. \u518d\u89c1, China! Until next time.",lat:30.2340,lng:120.4360}
    ]}
  ],

function gUrl(lat,lng){return`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;}

function parseTimeToMinutes(t){if(!t)return 9999;let s=t.split(/[–\-—]/)[0].trim();const m=s.match(/(\d{1,2}):?(\d{2})?\s*(AM|PM|am|pm)?/i);if(!m)return 9999;let h=parseInt(m[1]),mi=parseInt(m[2]||'0');const p=(m[3]||'').toUpperCase();if(!p){const f=t.match(/(AM|PM)/i);if(f){const pp=f[1].toUpperCase();if(pp==='PM'&&h!==12)h+=12;if(pp==='AM'&&h===12)h=0;}}else{if(p==='PM'&&h!==12)h+=12;if(p==='AM'&&h===12)h=0;}return h*60+mi;}

function initDragReorder(){
  const list=document.getElementById('routeDragList');if(!list)return;let dragItem=null,placeholder=null;const di=state.selectedDay;
  list.querySelectorAll('.drag-handle').forEach(handle=>{handle.addEventListener('mousedown',onStart);handle.addEventListener('touchstart',onTouchStart,{passive:false});});
  function onTouchStart(e){e.preventDefault();onStart({target:e.target,clientY:e.touches[0].clientY,_isTouch:true});}

function saveHTMLFile(){
  try{
    const json=JSON.stringify(DATA,null,2);
    const html=document.documentElement.outerHTML;
    const startTag='/*DATA_START*/';const endTag='/*DATA_END*/';
    const si=html.indexOf(startTag);const ei=html.indexOf(endTag);
    if(si===-1||ei===-1){toast('Save error: data markers not found');return;}
    const before=html.slice(0,si+startTag.length);const after=html.slice(ei);
    const newHTML='<!DOCTYPE html>\n'+before+'\nconst DATA = '+json+';\n'+after;
    const blob=new Blob([newHTML],{type:'text/html'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Shanghai_Hangzhou_Trip_Planner.html';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);
    markClean();toast('File saved!');
  }catch(e){toast('Save failed: '+e.message);}
}
function generatePDF(){
  try{
    const{jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
    const W=210,H=297,M=15,CW=W-2*M;let y=0;
    const accent=[196,30,58],dk=[28,25,23],muted=[107,114,128],white=[255,255,255];
    function addPage(){doc.addPage();y=M;return y;}
    function checkY(need){if(y+need>H-M)addPage();return y;}
    function heading(text,size,color){checkY(14);doc.setFontSize(size||14);doc.setTextColor(...(color||dk));doc.setFont(undefined,'bold');doc.text(text,M,y);y+=size*0.5+2;doc.setFont(undefined,'normal');}
    function para(text,size,color,indent){size=size||9;doc.setFontSize(size);doc.setTextColor(...(color||dk));const lines=doc.splitTextToSize(text,CW-(indent||0));lines.forEach(line=>{checkY(size*0.45+1);doc.text(line,M+(indent||0),y);y+=size*0.45+1;});}
    function divider(){checkY(6);doc.setDrawColor(232,224,216);doc.line(M,y,W-M,y);y+=4;}

    // Title page
    doc.setFillColor(...accent);doc.rect(0,0,W,H,'F');
    doc.setTextColor(...white);doc.setFontSize(28);doc.setFont(undefined,'bold');
    doc.text('Shanghai & Hangzhou',W/2,80,{align:'center'});
    doc.setFontSize(16);doc.text('10-Day Trip Planner',W/2,95,{align:'center'});
    doc.setFontSize(11);doc.setFont(undefined,'normal');
    doc.text('September 1–10, 2027',W/2,110,{align:'center'});
    doc.text('上海 · 杭州',W/2,122,{align:'center'});
    doc.setFontSize(8);doc.text('Produced by D. Chan',W/2,260,{align:'center'});

    // Transport page
    addPage();heading('🚄 Transport',16,accent);y+=4;
    const tr=DATA.transport;
    para('To Shanghai: '+tr.toShanghai.route+' — '+tr.toShanghai.date,10);y+=2;
    para(tr.toShanghai.note,9,muted);y+=4;
    para('Shanghai → Hangzhou: '+tr.shanghaiToHangzhou.route,10);y+=2;
    para(tr.shanghaiToHangzhou.date+' · '+tr.shanghaiToHangzhou.depart+' → '+tr.shanghaiToHangzhou.arrive+' ('+tr.shanghaiToHangzhou.duration+')',9,muted);y+=4;
    para('Home: '+tr.home.route+' — '+tr.home.date,10);y+=2;
    para(tr.home.note,9,muted);

    // Accommodation
    y+=8;heading('🏨 Accommodation',16,accent);y+=4;
    const sha=DATA.trip.accommodation.shanghai,hzh=DATA.trip.accommodation.hangzhou;
    para(sha.name+' ('+sha.nights+' nights)',11);para(sha.address,9,muted);para(sha.checkIn+' → '+sha.checkOut,9,muted);y+=4;
    para(hzh.name+' ('+hzh.nights+' nights)',11);para(hzh.address,9,muted);para(hzh.checkIn+' → '+hzh.checkOut,9,muted);

    // Dining reservations
    y+=8;heading('⭐ Must-Book Restaurants',14,accent);y+=2;
    const reserved=[];DATA.itinerary.forEach(day=>{day.segments.forEach(s=>{if(s.reserved||s.title.includes('RESERVED'))reserved.push({day:day.day,date:day.date,title:s.title,time:s.time});});});
    reserved.forEach(r=>{para('Day '+r.day+' ('+r.date+') '+r.time+': '+r.title,9);y+=1;});

    // Itinerary
    DATA.itinerary.forEach(day=>{
      addPage();
      doc.setFillColor(...accent);doc.rect(0,0,W,28,'F');
      doc.setTextColor(...white);doc.setFontSize(14);doc.setFont(undefined,'bold');
      doc.text('Day '+day.day+': '+day.title,M,14);
      doc.setFontSize(9);doc.setFont(undefined,'normal');doc.text(day.date+' · '+day.segments.length+' stops',M,22);
      y=36;
      day.segments.forEach(s=>{
        checkY(20);
        doc.setFontSize(9);doc.setTextColor(...accent);doc.setFont(undefined,'bold');doc.text(s.time,M,y);
        doc.setTextColor(...dk);doc.text(s.title,M+24,y);y+=5;
        doc.setFont(undefined,'normal');
        para(s.desc,8,muted,24);y+=3;
      });
    });

    // Critics
    addPage();heading('⭐ Critic\'s Picks',16,accent);y+=4;
    CATS.forEach(cat=>{
      const items=DATA.critics[cat]||[];if(items.length===0)return;
      checkY(12);heading(CAT_LABELS[cat],12);y+=2;
      items.forEach((it,i)=>{
        checkY(14);
        doc.setFontSize(9);doc.setTextColor(...dk);doc.setFont(undefined,'bold');
        doc.text((i+1)+'. '+it.name,M,y);
        doc.setFont(undefined,'normal');doc.setTextColor(...muted);
        doc.text((it.rating?'⭐'+it.rating:'')+(it.price?' · '+it.price:''),M+80,y);y+=4;
        para(it.why,8,muted,4);y+=2;
      });
      y+=4;
    });

    // Walks
    addPage();heading('🏛️ Walks & Sites',16,accent);y+=4;
    DATA.trails.forEach(t=>{
      checkY(24);
      doc.setFontSize(10);doc.setTextColor(...dk);doc.setFont(undefined,'bold');doc.text(t.name,M,y);y+=5;
      doc.setFont(undefined,'normal');
      para(t.location+' · '+t.difficulty+' · '+t.distance+' · '+t.time,8,muted);y+=1;
      para(t.desc,8,dk,0);y+=1;
      if(t.seniorNotes){para('Tips: '+t.seniorNotes,8,muted,0);y+=1;}
      divider();
    });

    // Practical info
    checkY(40);heading('📱 Practical Info',16,accent);y+=4;
    DATA.practicalInfo.forEach(p=>{
      checkY(14);
      doc.setFontSize(9);doc.setTextColor(...dk);doc.setFont(undefined,'bold');doc.text(p.icon+' '+p.name,M,y);y+=4;
      doc.setFont(undefined,'normal');para(p.note,8,muted,4);y+=3;
    });

    doc.save('Shanghai_Hangzhou_Trip_2027.pdf');toast('PDF downloaded!');
  }catch(e){toast('PDF error: '+e.message);console.error(e);}
}
window.addEventListener('beforeunload',e=>{if(_dirty){e.preventDefault();e.returnValue='';}});
sortAllItineraries();render();
</script>
</body>
</html>
